<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goldfish · Space aquarium</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#060b19;color:#d4e4e8;font:13px monospace;min-height:100svh;display:grid;place-items:center}main{width:min(100%,1100px);padding:24px}header,footer{display:flex;justify-content:space-between;align-items:center;gap:20px}header{margin-bottom:22px}h1{font-size:15px;letter-spacing:4px;font-weight:400}small{color:#7e9aaf;letter-spacing:2px}canvas{display:block;width:100%;aspect-ratio:2/1;image-rendering:pixelated;border:1px solid #233447;background:#080e20}footer{margin-top:20px;color:#8198ac;font-size:11px;line-height:1.6}button{font:inherit;color:#a8edd7;border:1px solid #365c63;background:#0d202b;padding:10px 18px;cursor:pointer}button:hover{background:#16343c}@media(max-width:500px){main{padding:12px}small{display:none}h1{font-size:12px}footer{gap:10px}}
</style>
<main>
 <header><h1>GOLDFISH / COSMOS</h1><small>08 HABITANTES · ÓRBITA LIBRE</small></header>
 <canvas id="space" width="640" height="320" role="img" aria-label="Ocho goldfish verdes y azules de colas largas nadando y cruzándose en el espacio"></canvas>
 <footer><span>Un pequeño acuario entre las estrellas.<br>Pixel art · Verde jade & azul celeste</span><button id="pause" type="button">Pausar</button></footer>
</main>
<script src="animation.js"></script>
<script>
const canvas=document.querySelector('canvas');
const draw=createAquarium(canvas.getContext('2d'));
const button=document.querySelector('button');
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
let elapsed=0,last=null;
function label(){button.textContent=paused?'Reanudar':'Pausar';button.setAttribute('aria-pressed',String(paused));}
button.onclick=()=>{paused=!paused;label();};label();
function frame(now){if(last!==null&&!paused)elapsed+=Math.min((now-last)/1000,.1);last=now;draw(elapsed);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</html>
